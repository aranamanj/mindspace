name: mindspace
description: "A mental health companion app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mindspace_logo_1024.png

flutter_native_splash:
  color: "#6B9EFF"
  image: assets/mindspace_logo_1024.png
  android_12:
    color: "#6B9EFF"
    image: assets/mindspace_logo_1024.png